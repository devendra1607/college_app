<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>College Admin Panel - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <main class="container-fluid login-wrapper">
    <div class="row min-vh-100">
      <section class="col-lg-7 d-none d-lg-flex gradient-side p-5 align-items-end">
        <div>
          <h1 class="display-5 fw-bold">Welcome to CampusFlow Admin</h1>
          <p class="lead">A modern, responsive workspace for admissions, academics, attendance, and analytics.</p>
        </div>
      </section>
      <section class="col-lg-5 d-flex align-items-center justify-content-center p-4">
        <div class="glass-card p-4 p-md-5 w-100" style="max-width: 450px;">
          <h2 class="h3 fw-bold mb-2">Sign in</h2>
          <p class="text-secondary mb-4">Manage your college operations in one place.</p>
          <form>
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control form-control-lg" placeholder="admin@college.edu" />
            </div>
            <div class="mb-2">
              <label class="form-label">Password</label>
              <input type="password" class="form-control form-control-lg" placeholder="••••••••" />
            </div>
            <div class="text-end mb-4"><a href="#" class="small text-decoration-none">Forgot password?</a></div>
            <a href="pages/dashboard.html" class="btn btn-primary btn-modern w-100 btn-lg">Login</a>
          </form>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
